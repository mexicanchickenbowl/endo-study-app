<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#667eea">
<title>EndoBoard - Board Review</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary:       #6366f1;
  --primary-dark:  #4f46e5;
  --primary-light: #a5b4fc;
  --primary-glow:  rgba(99,102,241,.15);
  --success:       #22c55e;
  --success-bg:    #f0fdf4;
  --danger:        #ef4444;
  --danger-bg:     #fef2f2;
  --warning:       #f59e0b;
  --warning-bg:    #fffbeb;
  --bg:            #f1f5f9;
  --card:          #ffffff;
  --text:          #0f172a;
  --text-secondary:#475569;
  --border:        #e2e8f0;
  --radius:        18px;
  --radius-sm:     12px;
  --shadow:        0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.06);
  --shadow-lg:     0 4px 6px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.1);
  --transition:    all .2s cubic-bezier(.4,0,.2,1);
  --sidebar-w:     240px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:           #0f172a;
    --card:         #1e293b;
    --text:         #f1f5f9;
    --text-secondary:#b0bec5;
    --border:       #334155;
    --success-bg:   #052e16;
    --danger-bg:    #2d0a0a;
    --warning-bg:   #1c1208;
    --shadow:       0 1px 3px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
    --shadow-lg:    0 4px 6px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.4);
    --primary-glow: rgba(99,102,241,.2);
  }
}
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ── */
.app {
  max-width: 680px;
  margin: 0 auto;
  padding-bottom: 84px;
}
@media (min-width: 900px) {
  body { display: block; }
  .app {
    max-width: none;
    margin-left: var(--sidebar-w);
    padding-bottom: 40px;
    min-height: 100vh;
    width: calc(100vw - var(--sidebar-w));
  }
  .page-inner {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 32px;
  }
}

/* ── Bottom nav (mobile) ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around;
  padding: 8px 0 max(8px, env(safe-area-inset-bottom));
  z-index: 100;
  box-shadow: 0 -4px 20px rgba(0,0,0,.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
@media (min-width: 900px) {
  .bottom-nav { display: none !important; }
}
.nav-item {
  display: flex; flex-direction: column; align-items: center;
  font-size: 11px; font-weight: 500; color: var(--text-secondary);
  cursor: pointer; padding: 4px 16px;
  transition: var(--transition); border: none; background: none;
  gap: 2px;
}
.nav-item.active { color: var(--primary); }
.nav-item svg { width: 22px; height: 22px; }
.nav-item { position: relative; }
.nav-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700; border-radius: 999px;
  position: absolute; top: 0; right: 6px;
}
.sidebar-item .nav-badge { position: static; margin-left: auto; }

/* ── Sidebar (desktop) ── */
.sidebar {
  display: none;
}
@media (min-width: 900px) {
  .sidebar {
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    z-index: 200;
    gap: 4px;
  }
  .sidebar-logo {
    font-size: 20px; font-weight: 800; color: var(--primary);
    letter-spacing: -0.5px;
    padding: 0 12px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .sidebar-logo span { color: var(--text); }
  .sidebar-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500; color: var(--text-secondary);
    cursor: pointer; transition: var(--transition);
    border: none; background: none; width: 100%; text-align: left;
  }
  .sidebar-item:hover { background: var(--bg); color: var(--text); }
  .sidebar-item.active {
    background: var(--primary-glow);
    color: var(--primary);
    font-weight: 600;
  }
  .sidebar-item svg { width: 20px; height: 20px; flex-shrink: 0; }
  .sidebar-spacer { flex: 1; }
  .sidebar-version {
    font-size: 11px; color: var(--text-secondary);
    padding: 8px 12px;
    opacity: .6;
  }
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white;
  padding: 28px 24px 20px;
  position: sticky; top: 0; z-index: 50;
}
@media (min-width: 900px) {
  .header {
    border-radius: 0 0 var(--radius) var(--radius);
    position: relative;
    padding: 32px 32px 24px;
  }
}
.header h1 {
  font-size: 24px; font-weight: 800; letter-spacing: -.5px;
}
.header .subtitle { font-size: 14px; opacity: .75; margin-top: 2px; font-weight: 500; }

/* ── Streak banner ── */
.streak-banner {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 10px 20px; margin: 0 20px;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  border-radius: 0 0 var(--radius) var(--radius);
  color: white; font-weight: 700; font-size: 14px;
  box-shadow: 0 4px 12px rgba(245,158,11,.3);
}
@media (min-width: 900px) {
  .streak-banner { margin: 0 0 8px; border-radius: var(--radius); }
}
.streak-banner .fire { font-size: 18px; }

/* ── Cards ── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin: 12px 16px;
  box-shadow: var(--shadow);
  transition: var(--transition);
}
@media (min-width: 900px) {
  .card { margin: 16px 0; padding: 24px; }
}
.card-title {
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px;
}

/* ── Stats row ── */
.stats-row {
  display: flex; gap: 10px; margin: 12px 16px;
}
@media (min-width: 900px) {
  .stats-row { margin: 16px 0; gap: 16px; }
}
.stat-card {
  flex: 1; background: var(--card); border-radius: var(--radius-sm);
  padding: 16px 10px; text-align: center; box-shadow: var(--shadow);
}
.stat-value { font-size: 26px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
.stat-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

/* ── Readiness ring ── */
.readiness-ring {
  width: 130px; height: 130px; margin: 0 auto 16px;
  position: relative;
}
.readiness-ring svg { transform: rotate(-90deg); }
.readiness-ring .score {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 30px; font-weight: 800; color: var(--primary); letter-spacing: -1px;
}
.readiness-label { text-align: center; font-size: 14px; color: var(--text-secondary); font-weight: 500; }

/* ── Chapter list ── */
.chapter-item {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 0; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: var(--transition);
}
.chapter-item:hover { padding-left: 4px; }
.chapter-item:last-child { border-bottom: none; }
.chapter-num {
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(99,102,241,.3);
}
.chapter-num.mastered { background: linear-gradient(135deg, #22c55e, #16a34a); box-shadow: 0 2px 8px rgba(34,197,94,.3); }
.chapter-num.learning  { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 2px 8px rgba(245,158,11,.3); }
.chapter-info { flex: 1; min-width: 0; }
.chapter-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapter-progress { font-size: 12px; color: var(--text-secondary); margin-top: 2px; font-weight: 500; }
.chapter-bar { height: 5px; background: var(--border); border-radius: 3px; margin-top: 7px; overflow: hidden; }
.chapter-bar-fill { height: 100%; border-radius: 3px; transition: width .6s cubic-bezier(.4,0,.2,1); }
.chapter-weight {
  display: inline-block; margin-left: 8px;
  font-size: 10px; font-weight: 700; letter-spacing: .3px;
  text-transform: uppercase; color: var(--primary-dark);
  background: var(--primary-glow); padding: 2px 7px; border-radius: 999px;
  vertical-align: middle;
}
.chapter-weight.high { color: #fff; background: var(--primary); }

/* ── Blueprint coverage table (Stats page) ── */
.blueprint-table { display: flex; flex-direction: column; gap: 10px; }
.bp-row {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) auto 1fr 44px;
  align-items: center; gap: 10px;
  font-size: 13px;
}
.bp-label { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bp-weight { font-size: 11px; color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
.bp-bar-wrap { position: relative; height: 14px; }
.bp-bar-target { position: absolute; top: 0; left: 0; height: 14px; background: var(--border); border-radius: 4px; }
.bp-bar-actual { position: absolute; top: 0; left: 0; height: 14px; border-radius: 4px; transition: width .6s cubic-bezier(.4,0,.2,1); }
.bp-acc { font-size: 12px; font-weight: 700; text-align: right; color: var(--text-secondary); }
.bp-prio {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--primary); margin-right: 6px; vertical-align: middle;
}
@media (min-width: 900px) {
  .chapters-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 24px;
  }
  .chapter-item { padding: 12px 0; }
}

/* ── Quiz header ── */
.quiz-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 20px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50;
}
@media (min-width: 900px) {
  .quiz-header { border-radius: var(--radius) var(--radius) 0 0; padding: 16px 28px; }
}
.quiz-back {
  background: none; border: none; font-size: 15px;
  color: var(--primary); cursor: pointer; padding: 8px 12px;
  border-radius: 8px; font-weight: 600;
  transition: var(--transition);
}
.quiz-back:hover { background: var(--primary-glow); }
.quiz-progress-text { font-size: 14px; color: var(--text-secondary); font-weight: 600; }
.quiz-timer { font-size: 14px; color: var(--warning); font-weight: 700; font-variant-numeric: tabular-nums; }
.quiz-wrapper {
  max-width: 820px;
  margin: 0 auto;
  padding: 0 32px;
}
@media (max-width: 899px) {
  .quiz-wrapper { padding: 0; }
}
.progress-bar-strip {
  height: 3px; background: var(--border);
  position: sticky; top: 53px; z-index: 49;
}
.progress-bar-strip-fill {
  height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light));
  transition: width .4s ease;
}

/* ── Question card ── */
.question-card {
  background: var(--card);
  margin: 16px;
  border-radius: var(--radius);
  padding: 28px 24px;
  box-shadow: var(--shadow-lg);
}
@media (min-width: 900px) {
  .question-card { margin: 24px 0; padding: 36px 36px 28px; }
}
.q-number {
  font-size: 12px; color: var(--primary); font-weight: 700;
  text-transform: uppercase; letter-spacing: .8px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;
}
.q-number::before {
  content: '';
  display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; background: var(--primary);
}
.q-text {
  font-size: 18px; line-height: 1.7; font-weight: 500; margin-bottom: 24px;
  color: var(--text);
}
@media (min-width: 900px) {
  .q-text { font-size: 19px; }
}

/* ── Options ── */
.option-btn {
  display: flex; align-items: flex-start; gap: 12px;
  width: 100%; text-align: left;
  padding: 16px 20px; margin-bottom: 12px;
  background: var(--bg); border: 2px solid var(--border);
  border-radius: var(--radius-sm); font-size: 16px; line-height: 1.5;
  cursor: pointer; transition: var(--transition);
  color: var(--text); font-family: inherit;
}
.option-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-glow); transform: translateX(2px); }
.option-btn.selected  { border-color: var(--primary); background: var(--primary-glow); }
.option-btn.correct   { border-color: var(--success); background: var(--success-bg); }
.option-btn.incorrect { border-color: var(--danger);  background: var(--danger-bg); }
.option-btn.show-correct { border-color: var(--success); background: var(--success-bg); }
.option-letter {
  font-weight: 700; color: var(--primary);
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--primary-glow);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0; margin-top: 1px;
}
.option-btn.correct   .option-letter { background: var(--success-bg); color: var(--success); }
.option-btn.incorrect .option-letter { background: var(--danger-bg);  color: var(--danger); }

/* ── Explanation ── */
.explanation-box {
  margin-top: 20px; padding: 20px 24px; border-radius: var(--radius-sm);
  background: var(--primary-glow); border-left: 4px solid var(--primary);
  font-size: 15px; line-height: 1.75; display: none;
}
.explanation-box.show { display: block; }
.explanation-box strong { color: var(--primary); font-size: 16px; }

/* ── Buttons ── */
.next-btn {
  display: block; width: calc(100% - 32px); margin: 16px auto;
  padding: 16px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white; border: none; border-radius: var(--radius-sm);
  font-size: 16px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: var(--transition);
  box-shadow: 0 4px 16px rgba(99,102,241,.35);
  letter-spacing: .2px;
}
.next-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,.45); }
.next-btn:active { transform: scale(.98); }
@media (min-width: 900px) {
  .next-btn { width: 100%; margin: 20px 0 0; }
}

/* ── Mode grid ── */
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-btn {
  background: var(--card); border: 2px solid var(--border);
  border-radius: var(--radius); padding: 20px 14px;
  text-align: center; cursor: pointer; transition: var(--transition);
}
.mode-btn:hover { border-color: var(--primary); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.mode-btn:active { transform: scale(.97); }
.mode-btn .mode-icon { font-size: 28px; margin-bottom: 8px; }
.mode-btn .mode-name { font-size: 14px; font-weight: 700; }
.mode-btn .mode-desc { font-size: 12px; color: var(--text-secondary); margin-top: 4px; font-weight: 500; }
.mode-btn-primary { border-color: var(--primary); background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; }
.mode-btn-primary .mode-desc { color: rgba(255,255,255,.85); }
.mode-btn-primary:hover { box-shadow: 0 8px 24px var(--primary-glow); }

/* ── Citation pill (shown under explanations) ── */
.citation {
  margin-top: 14px; padding: 12px 14px;
  border-left: 3px solid var(--primary);
  background: var(--primary-glow);
  border-radius: var(--radius-sm);
  font-size: 13px; line-height: 1.5; color: var(--text);
}
.citation .cite-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--primary-dark); letter-spacing: .5px; display: block; margin-bottom: 4px; }
.citation .cite-tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; text-transform: uppercase; vertical-align: middle; }
.citation-classic  .cite-tag { background: var(--success-bg); color: var(--success); }
.citation-historic .cite-tag { background: var(--warning-bg); color: var(--warning); }
.citation .cite-relevance { display: block; margin-top: 6px; color: var(--text-secondary); font-style: italic; font-size: 12px; }

/* ── Flashcard ── */
.flashcard-container { perspective: 1200px; margin: 16px; }
@media (min-width: 900px) { .flashcard-container { margin: 20px 0; } }
.flashcard {
  width: 100%; min-height: 220px; position: relative;
  transform-style: preserve-3d; transition: transform .55s cubic-bezier(.4,0,.2,1);
  cursor: pointer;
}
.flashcard.flipped { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute; width: 100%; min-height: 220px;
  backface-visibility: hidden; border-radius: var(--radius);
  padding: 32px 28px;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center; text-align: center;
  box-shadow: var(--shadow-lg);
}
.flashcard-front {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white; font-size: 18px; line-height: 1.6; font-weight: 500;
}
.flashcard-back {
  background: var(--card); transform: rotateY(180deg);
  font-size: 16px; line-height: 1.7; color: var(--text);
}
.flashcard-hint { font-size: 12px; opacity: .65; margin-top: 16px; }
.flashcard-nav { display: flex; gap: 12px; margin: 16px; }
@media (min-width: 900px) { .flashcard-nav { margin: 16px 0; } }
.flashcard-nav button {
  flex: 1; padding: 14px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 700; font-family: inherit;
  cursor: pointer; border: 2px solid var(--border);
  background: var(--card); color: var(--text);
  transition: var(--transition);
}
.flashcard-nav .knew-it  { border-color: var(--success); color: var(--success); }
.flashcard-nav .study-more { border-color: var(--warning); color: var(--warning); }
.flashcard-nav .knew-it:hover   { background: var(--success-bg); }
.flashcard-nav .study-more:hover { background: var(--warning-bg); }

/* ── Results ── */
.results-container { text-align: center; padding: 32px 16px 16px; }
.results-score { font-size: 64px; font-weight: 800; color: var(--primary); letter-spacing: -3px; line-height: 1; }
.results-label { font-size: 15px; color: var(--text-secondary); margin: 8px 0 20px; font-weight: 500; }
.results-breakdown { text-align: left; }
.result-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.result-q { font-size: 14px; flex: 1; margin-right: 12px; line-height: 1.5; }
.result-badge {
  padding: 4px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 700; white-space: nowrap;
}
.result-badge.correct   { background: var(--success-bg); color: var(--success); }
.result-badge.incorrect { background: var(--danger-bg);  color: var(--danger); }

/* ── Chapter select grid ── */
.chapter-select-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
@media (min-width: 900px) {
  .chapter-select-grid { grid-template-columns: repeat(7, 1fr); }
}
.ch-select-btn {
  padding: 10px 4px; border-radius: 10px; border: 2px solid var(--border);
  background: var(--card); font-size: 13px; font-weight: 600;
  cursor: pointer; text-align: center; transition: var(--transition);
  color: var(--text); font-family: inherit;
}
.ch-select-btn.selected { border-color: var(--primary); background: var(--primary-glow); color: var(--primary); }
.ch-select-btn:hover { border-color: var(--primary); }

/* ── Charts ── */
.chart-bar-group { display: flex; align-items: flex-end; justify-content: space-between; height: 160px; padding: 0 4px; gap: 4px; }
.chart-bar-wrapper { display: flex; flex-direction: column; align-items: center; flex: 1; }
.chart-bar { width: 80%; min-width: 10px; border-radius: 6px 6px 0 0; transition: height .6s cubic-bezier(.4,0,.2,1); }
.chart-bar-label { font-size: 10px; font-weight: 600; color: var(--text-secondary); margin-top: 5px; writing-mode: vertical-lr; transform: rotate(180deg); height: 32px; }
.chart-percent { font-size: 10px; font-weight: 700; color: var(--text); margin-bottom: 3px; }

/* ── Misc ── */
.xp-popup {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-size: 28px; font-weight: 800; color: var(--success);
  pointer-events: none; z-index: 200;
  animation: xpFloat 1s ease-out forwards;
  text-shadow: 0 2px 12px rgba(34,197,94,.4);
}
@keyframes xpFloat {

<script>
const QUESTIONS = window.QUESTIONS;
const FLASHCARDS = [{"id":"fc_ch1_1","chapter":1,"chapterTitle":"Evidence-Based Dentistry","front":"What P value indicates statistical significance?","back":"P <= 0.05 (less than 5% probability results occurred by chance)","category":"high-yield"}];
const CHAPTERS = [
  {num:1,title:"Evidence-Based Dentistry",short:"EBD"},
  {num:2,title:"Microbiology",short:"Micro"},
  {num:3,title:"Pulpal & Periapical Anatomy",short:"Anat"},
  {num:4,title:"Pulpal & Periapical Pathology",short:"Path"},
  {num:5,title:"Medicine & Pharmacology",short:"Pharm"},
  {num:6,title:"Diagnosis",short:"Dx"},
  {num:7,title:"Non-Endo Disease",short:"NonEndo"},
  {num:8,title:"Treatment",short:"Tx"},
  {num:9,title:"Traumatic Injuries",short:"Trauma"},
  {num:10,title:"Cracked & Fractured Teeth",short:"Cracks"},
  {num:11,title:"Resorptive Diseases",short:"Resorp"},
  {num:12,title:"Prognosis",short:"Prog"},
  {num:13,title:"Complications",short:"Comp"}

// ABE written-exam content weighting. First-pass approximation of the
// published ABE blueprint — tune these to the most current AAE/ABE

// blueprintSample() below to make Exam Sim, Quick 10, and overflow Review
// Due sessions mirror the real exam's mix rather than the uniform chapter
// distribution the bank happens to have.
const BLUEPRINT = {
  1:  0.03,  // Evidence-Based Dentistry
  2:  0.08,  // Microbiology
  3:  0.06,  // Pulpal & Periapical Anatomy
  4:  0.12,  // Pulpal & Periapical Pathology
  5:  0.06,  // Medicine & Pharmacology
  6:  0.15,  // Diagnosis
  7:  0.04,  // Non-Endo Disease
  8:  0.20,  // Treatment
  9:  0.10,  // Traumatic Injuries
  10: 0.05,  // Cracked & Fractured Teeth
  11: 0.04,  // Resorptive Diseases
  12: 0.04,  // Prognosis
  13: 0.03,  // Complications
};
let state = {
  screen: 'loading',
  quizMode: null,
  quizQuestions: [],
  currentIndex: 0,
  selectedAnswer: null,
  answered: false,
  sessionResults: [],
  selectedChapters: [],
  flashcardIndex: 0,
  flashcardFlipped: false,
  timerSeconds: 0,
  timerInterval: null,
  examTimeLimit: 3600,
};
const STORAGE_KEY = 'endoboard_progress';
function getDefaultProgress() {
  return {
    schemaVersion: 2,
    xp: 0,
    streak: 0,
    lastStudyDate: null,
    questionHistory: {},
    sessionHistory: [],
    flashcardHistory: {},
    flagged: {},
    totalQuestions: 0,
    totalCorrect: 0,
  };
}
// SM-2 defaults per card history entry
const SM2_DEFAULTS = {ease: 2.5, interval: 0, repetitions: 0, dueDate: 0, lastGrade: null};
let progress = getDefaultProgress();
function loadProgress() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      progress = {...getDefaultProgress(), ...parsed};
      // One-time migration to SM-2 schema (v2). Back up the old blob first
      // so a buggy migration never destroys user progress.
      if (!parsed.schemaVersion || parsed.schemaVersion < 2) {
        try { localStorage.setItem('endoboard_progress_backup_v1', saved); } catch(e) {}
        migrateToSm2();
        progress.schemaVersion = 2;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch(e) {}
      }
    }
  } catch(e) { console.error('Load error:', e); }
  updateStreak();
}
// Migration: for every existing history entry, add SM-2 fields and spread
// dueDates across the next 14 days proportional to mastery so users aren't
// flooded with "due today" on first launch of the new schema.
function migrateToSm2() {
  const now = Date.now();
  const ONE_DAY = 86400000;
  const ids = Object.keys(progress.questionHistory);
  ids.forEach((id, i) => {
    const h = progress.questionHistory[id];
    if (h.ease !== undefined) return; // already migrated
    const mastery = h.attempts > 0 ? (h.correct / h.attempts) : 0;
    // Weaker cards come due sooner (0 days); stronger cards spread out to 14 days.
    const spreadDays = Math.round(mastery * 14);
    h.ease = 2.5;
    h.interval = spreadDays || 0;
    h.repetitions = h.correct || 0;
    h.dueDate = now + spreadDays * ONE_DAY;
    h.lastGrade = null;
  });
}
function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch(e) { console.error('Save error:', e); }
}
function updateStreak() {
  const today = new Date().toDateString();
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (progress.lastStudyDate === today) return;
  if (progress.lastStudyDate === yesterday) {
    progress.streak++;
  } else if (progress.lastStudyDate !== today) {
    progress.streak = progress.lastStudyDate ? 0 : 0;
  }
}
function recordStudyToday() {
  const today = new Date().toDateString();
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (progress.lastStudyDate !== today) {
    if (progress.lastStudyDate === yesterday) {
      progress.streak++;
    } else {
      progress.streak = 1;
    }
    progress.lastStudyDate = today;
  }
}




// saveProgress is defined above. No Firebase sync — Apple privacy manifest
// prefers zero tracking/network for a study-only app.

function getChapterStats(chNum) {
  const chQuestions = QUESTIONS.filter(q => q.chapter === chNum);
  let attempted = 0, correct = 0, mastered = 0;
  chQuestions.forEach(q => {
    const h = progress.questionHistory[q.id];
    if (h && h.attempts > 0) {
      attempted++;
      if (h.correct > 0) correct++;
      if (h.correct >= 2) mastered++;
    }
  });
  return {
    total: chQuestions.length,
    attempted, correct, mastered,
    pct: attempted > 0 ? Math.round((correct / attempted) * 100) : 0,
    masteryPct: chQuestions.length > 0 ? Math.round((mastered / chQuestions.length) * 100) : 0
  };
}
function getBoardReadiness() {
  let totalWeight = 0, weightedScore = 0;
  CHAPTERS.forEach(ch => {
    const stats = getChapterStats(ch.num);
    const weight = stats.total;
    const recency = getRecencyFactor(ch.num);
    totalWeight += weight;
    weightedScore += (stats.pct / 100) * weight * recency;
  });
  return totalWeight > 0 ? Math.round((weightedScore / totalWeight) * 100) : 0;
}
function getRecencyFactor(chNum) {
  const chQuestions = QUESTIONS.filter(q => q.chapter === chNum);
  let latestSeen = 0;
  chQuestions.forEach(q => {
    const h = progress.questionHistory[q.id];
    if (h && h.lastSeen) latestSeen = Math.max(latestSeen, h.lastSeen);
  });
  if (!latestSeen) return 0.5;
  const daysSince = (Date.now() - latestSeen) / 86400000;
  if (daysSince < 7) return 1;
  if (daysSince < 30) return 0.8;
  return 0.6;
}
function getWeakQuestions() {
  return QUESTIONS.filter(q => {
    const h = progress.questionHistory[q.id];
    return h && h.attempts > 0 && (h.correct / h.attempts) < 0.5;
  });
}
function getUnseenQuestions() {
  return QUESTIONS.filter(q => !progress.questionHistory[q.id]);
}
// --- SM-2 (SuperMemo-2) spaced repetition ---------------------------------
// Pure function: mutates the passed history entry in place.
// grade 0-5 per SuperMemo: <3 = forgot (reset), >=3 = remembered.
// Tested by scripts/validate_sm2.mjs.
function applySM2(h, grade) {
  if (h.ease === undefined) Object.assign(h, SM2_DEFAULTS);
  if (grade < 3) {
    h.repetitions = 0;
    h.interval = 1;
  } else {
    h.repetitions = (h.repetitions || 0) + 1;
    if (h.repetitions === 1)      h.interval = 1;
    else if (h.repetitions === 2) h.interval = 6;
    else                          h.interval = Math.round(h.interval * h.ease);
  }
  h.ease = Math.max(1.3, h.ease + (0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02)));
  h.dueDate = Date.now() + h.interval * 86400000;
  h.lastGrade = grade;
  return h;
}
// Render a citation pill under an answered question. Returns empty string
// when the question has no citation or the citation hasn't been human-verified
// yet — we never show hallucinated references to users studying for boards.
function renderCitation(q) {
  const c = q.citation;
  if (!c || !c.verified) return '';
  const cls = c.classification === 'historic' ? 'citation-historic' : 'citation-classic';
  const coauthors = c.coauthors ? ', ' + escHtml(c.coauthors) : '';
  const vol = c.volume ? ' ' + escHtml(String(c.volume)) : '';
  const pages = c.pages ? ':' + escHtml(String(c.pages)) : '';
  const pmidLink = c.pmid
    ? ' <a href="https://pubmed.ncbi.nlm.nih.gov/' + encodeURIComponent(c.pmid) + '/" target="_blank" rel="noopener">PMID ' + escHtml(String(c.pmid)) + '</a>'
    : '';
  const relevance = c.relevance ? '<span class="cite-relevance">' + escHtml(c.relevance) + '</span>' : '';
  return '<div class="citation ' + cls + '">'
    + '<span class="cite-label">Cite this study<span class="cite-tag">' + (c.classification || 'classic') + '</span></span>'
    + '<strong>' + escHtml(c.author || '') + '</strong>'
    + (c.coauthors ? escHtml(', ' + c.coauthors) : '')
    + (c.year ? ' (' + escHtml(String(c.year)) + ')' : '')
    + '. <em>' + escHtml(c.title || '') + '</em>. '
    + escHtml(c.journal || '')
    + vol + pages + '.'
    + pmidLink
    + relevance
    + '</div>';
}
function getDueQuestions() {
  const now = Date.now();
  return QUESTIONS
    .filter(q => {
      const h = progress.questionHistory[q.id];
      return h && h.dueDate && h.dueDate <= now;
    })
    .sort((a, b) => {
      const ha = progress.questionHistory[a.id].dueDate;
      const hb = progress.questionHistory[b.id].dueDate;
      return ha - hb;
    });
}
function addXP(amount) {
  progress.xp += amount;
  showXPPopup('+' + amount + ' XP');
}
function showXPPopup(text) {
  const el = document.createElement('div');
  el.className = 'xp-popup';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}
function showConfetti() {
  const colors = ['#667eea','#48bb78','#ed8936','#f56565','#a3bffa'];
  for (let i = 0; i < 30; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDelay = Math.random() * 1 + 's';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.width = (6 + Math.random()*8) + 'px';
    c.style.height = (6 + Math.random()*8) + 'px';
    c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}
function startQuiz(mode, chapters) {
  let questions = [];
  // When the user hasn't explicitly picked chapters, we're free to re-weight
  // the draw to match the ABE exam blueprint. When they have picked chapters,
  // honor their intent (a trauma-only session should stay trauma-only).
  const userPickedChapters = !!(chapters && chapters.length > 0);
  const chapterNums = userPickedChapters ? chapters : CHAPTERS.map(c => c.num);
  if (mode === 'study') {
    questions = QUESTIONS.filter(q => chapterNums.includes(q.chapter));
    shuffleArray(questions);
  } else if (mode === 'exam') {
    const pool = QUESTIONS.filter(q => chapterNums.includes(q.chapter));
    questions = userPickedChapters ? (shuffleArray(pool), pool.slice(0, 50)) : blueprintSample(pool, 50);
  } else if (mode === 'weak') {
    questions = getWeakQuestions().filter(q => chapterNums.includes(q.chapter));
    shuffleArray(questions);
    if (questions.length === 0) {
      const unseen = getUnseenQuestions().filter(q => chapterNums.includes(q.chapter));
      questions = userPickedChapters ? (shuffleArray(unseen), unseen.slice(0, 20)) : blueprintSample(unseen, 20);

    const pool = QUESTIONS.filter(q => chapterNums.includes(q.chapter));

    const flaggedIds = Object.keys(progress.flagged || {});

    // capped at 20/session to avoid review fatigue. When more than 20 are due,
    // pick the 20 via blueprint sampling so a backlog doesn't drown you in the
    // one over-represented chapter.
    const dueAll = getDueQuestions().filter(q => chapterNums.includes(q.chapter));

      questions = dueAll;
    } else {

  state.quizQuestions = questions;
  state.currentIndex = 0;
  state.selectedAnswer = null;
  state.answered = false;
  state.sessionResults = [];
  state.screen = 'quiz';
  if (mode === 'exam') {
    state.timerSeconds = 0;
    clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
      state.timerSeconds++;
      const timerEl = document.getElementById('quiz-timer');
      if (timerEl) {
        const mins = Math.floor(state.timerSeconds / 60);

function selectAnswer(letter) {
  if (state.answered) return;
  state.selectedAnswer = letter;
  state.answered = true;
  const q = state.quizQuestions[state.currentIndex];
  const isCorrect = letter === (q.answer || q.correctAnswer);
  if (!progress.questionHistory[q.id]) {
    progress.questionHistory[q.id] = {attempts: 0, correct: 0, lastSeen: 0, ...SM2_DEFAULTS};

  h.attempts++;
  if (isCorrect) h.correct++;
  h.lastSeen = Date.now();

  // grade 2 = "incorrect but recognized". Grade 5 is reserved for a future
  // "I knew this instantly" button.
  applySM2(h, isCorrect ? 4 : 2);

  if (isCorrect) progress.totalCorrect++;
  state.sessionResults.push({questionId: q.id, correct: isCorrect});

function nextQuestion() {
  if (state.currentIndex < state.quizQuestions.length - 1) {
    state.currentIndex++;
    state.selectedAnswer = null;
    state.answered = false;
    renderQuizQuestion();
    window.scrollTo(0, 0);

    finishQuiz();
  }
}
function finishQuiz() {
  clearInterval(state.timerInterval);
  const correct = state.sessionResults.filter(r => r.correct).length;
  const total = state.sessionResults.length;
  progress.sessionHistory.push({
    date: Date.now(),
    mode: state.quizMode,
    score: correct,
    total: total,
    chapters: [...new Set(state.quizQuestions.map(q => q.chapter))]
  });

  if (correct / total >= 0.8) showConfetti();
  state.screen = 'results';
  render();
}
function startFlashcards(chapters) {
  const chapterNums = chapters && chapters.length > 0 ? chapters : CHAPTERS.map(c => c.num);
  const cards = FLASHCARDS.filter(c => chapterNums.includes(c.chapter));
  shuffleArray(cards);
  state.flashcards = cards;
  state.flashcardIndex = 0;
  state.flashcardFlipped = false;
  state.screen = 'flashcards';
  render();
}
function flipCard() {
  state.flashcardFlipped = !state.flashcardFlipped;
  render();
}
function flashcardResponse(knew) {
  const card = state.flashcards[state.flashcardIndex];
  if (!progress.flashcardHistory[card.id]) {
    progress.flashcardHistory[card.id] = {seen: 0, knew: 0};
  }
  progress.flashcardHistory[card.id].seen++;
  if (knew) progress.flashcardHistory[card.id].knew++;
  recordStudyToday();
  addXP(knew ? 5 : 2);
  saveProgress();
  if (state.flashcardIndex < state.flashcards.length - 1) {
    state.flashcardIndex++;
    state.flashcardFlipped = false;
  } else {

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
// Sample `count` questions from `pool` with the per-chapter frequency of
// BLUEPRINT, so Exam Sim and Quick 10 mirror the ABE content distribution
// instead of the uneven distribution of the question bank. Uses largest-
// remainder rounding so the counts add up exactly to `count`. Falls back to
// pulling from underrepresented chapters when a target chapter has too few
// available questions. Pure function — unit tested in scripts/validate_blueprint.mjs.
function blueprintSample(pool, count) {
  if (!pool.length || count <= 0) return [];
  if (pool.length <= count) { const c = pool.slice(); shuffleArray(c); return c; }

  const byChapter = {};
  pool.forEach(q => { (byChapter[q.chapter] = byChapter[q.chapter] || []).push(q); });

  // Restrict the blueprint to chapters actually represented in `pool`, then
  // renormalize so weights sum to 1 across that subset.
  const chapters = Object.keys(byChapter).map(Number);
  const weightSum = chapters.reduce((s, c) => s + (BLUEPRINT[c] || 0), 0) || 1;
  const targets = chapters.map(c => ({
    chapter: c,
    weight: (BLUEPRINT[c] || 0) / weightSum,
    available: byChapter[c].length,
  }));

  // Largest-remainder rounding, capped by availability.
  const raw = targets.map(t => {
    const want = t.weight * count;
    const cap  = Math.min(t.available, Math.ceil(want));
    return { ...t, want, floor: Math.min(t.available, Math.floor(want)), frac: want - Math.floor(want), cap };
  });
  let taken = raw.reduce((s, t) => s + t.floor, 0);
  raw.sort((a, b) => b.frac - a.frac);
  for (const t of raw) {
    if (taken >= count) break;
    if (t.floor < t.cap) { t.floor++; taken++; }
  }
  // Distribute any remaining shortfall to whichever chapters still have capacity.
  if (taken < count) {
    const overflow = raw.slice().sort((a, b) => (b.available - b.floor) - (a.available - a.floor));
    for (const t of overflow) {
      while (taken < count && t.floor < t.available) { t.floor++; taken++; }
    }
  }

  const out = [];
  raw.forEach(t => {
    const bucket = byChapter[t.chapter].slice();
    shuffleArray(bucket);
    out.push(...bucket.slice(0, t.floor));
  });
  shuffleArray(out);
  return out.slice(0, count);
}
function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function render() {
  const app = document.getElementById('app');
  switch(state.screen) {
    case 'dashboard': renderDashboard(app); break;
    case 'modes':     renderModes(app); break;
    case 'chapterSelect': renderChapterSelect(app); break;
    case 'quiz':      renderQuiz(app); break;
    case 'results':   renderResults(app); break;
    case 'flashcards': renderFlashcardScreen(app); break;
    case 'stats':     renderStatsScreen(app); break;
    case 'settings':  renderSettings(app); break;

}

function renderDashboard(app) {
  const readiness = getBoardReadiness();
  const weak = getWeakQuestions().length;
  const dueCount = getDueQuestions().length;
  const flaggedCount = Object.keys(progress.flagged || {}).length;
  const totalAttempted = Object.keys(progress.questionHistory).length;
  let html = '<div class="page-inner"><div class="header"><h1>EndoBoard</h1><div class="subtitle">ABE Board Review</div></div>';
  if (progress.streak > 0) {
    html += '<div class="streak-banner"><span class="fire">&#x1F525;</span> '+progress.streak+' day streak!</div>';
  }
  const circ = 2 * Math.PI * 45;
  const offset = circ - (readiness / 100) * circ;

function renderQuizQuestion() {
  const area = document.getElementById('quiz-question-area');
  if (!area) { render(); return; }
  const q = state.quizQuestions[state.currentIndex];
  const chTitle = CHAPTERS.find(c => c.num === q.chapter)?.short || '';
  const isFlagged = !!(progress.flagged && progress.flagged[q.id]);
  const correctAnswer = q.answer || q.correctAnswer;

  let html = '<div class="question-card">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
    + '<div class="q-number">Ch'+q.chapter+' \u00b7 '+escHtml(chTitle)+' \u00b7 Q'+q.number+'</div>'
    + '<button class="flag-btn '+(isFlagged?'flagged':'')+'" onclick="toggleFlag(\''+q.id+'\')" title="Flag for review">'+(isFlagged?'\u{1F6A9}':'\u{1F3F3}&#xFE0F;')+'</button>'
    + '</div>'
    + '<div class="q-text">'+escHtml(q.question)+'</div>';

  q.options.forEach((opt, i) => {
    const num = i + 1;
    let cls = 'option-btn';
    if (state.answered) {
      if (opt.letter === correctAnswer) cls += ' correct show-correct';
      else if (opt.letter === state.selectedAnswer && opt.letter !== correctAnswer) cls += ' incorrect';
    } else if (state.selectedAnswer === opt.letter) {
      cls += ' selected';
    }
    html += '<button class="'+cls+'" onclick="selectAnswer(\''+opt.letter+'\')" '+(state.answered?'disabled':'')+' data-key="'+num+'">'
      + '<span class="option-num">'+num+'</span> '+escHtml(opt.text)+'</button>';
  });

  if (state.answered) {
    const isCorrect = state.selectedAnswer === correctAnswer;
    html += '<div class="explanation-box show"><strong>'
      + (isCorrect ? '\u2705 Correct!' : '\u274C Incorrect \u2014 Answer: '+correctAnswer)
      + '</strong><br>'+escHtml(q.explanation||'')+'</div>';
    html += renderCitation(q);
  } else {
    html += '<div class="explanation-box"></div>';
    html += '<div class="kbd-hint">Press 1 \u00b7 2 \u00b7 3 \u00b7 4 to answer &nbsp;\u2502&nbsp; F to flag</div>';
  }
  html += '</div>';

  if (state.answered) {
    const isLast = state.currentIndex >= state.quizQuestions.length - 1;
    html += '<button class="next-btn" id="next-btn" onclick="nextQuestion()">'+(isLast ? 'See Results \u279C' : 'Next Question \u279C')+'</button>';
    html += '<div class="kbd-hint" style="margin-bottom:12px">Space or Enter for next &nbsp;\u2502&nbsp; F to flag</div>';
  }

  area.innerHTML = html;

  // Update progress bar
  const fillEl = document.getElementById('quiz-progress-fill');
  if (fillEl) {
    const pct = Math.round(((state.currentIndex + (state.answered ? 1 : 0)) / state.quizQuestions.length) * 100);
    fillEl.style.width = pct + '%';
  }

  setupQuizKeyboard();
}

function setupQuizKeyboard() {
  if (window._quizKeyHandler) document.removeEventListener('keydown', window._quizKeyHandler);
  window._quizKeyHandler = function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (state.screen !== 'quiz') {
      document.removeEventListener('keydown', window._quizKeyHandler);
      return;
    }
    const q = state.quizQuestions[state.currentIndex];
    if (!q) return;
    if (!state.answered) {
      if (['1','2','3','4'].includes(e.key)) {
        const idx = parseInt(e.key) - 1;
        if (q.options[idx]) selectAnswer(q.options[idx].letter);
      }
    } else {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); nextQuestion(); }
    }
    if (e.key === 'f' || e.key === 'F') toggleFlag(q.id);
  };
  document.addEventListener('keydown', window._quizKeyHandler);
}

function toggleFlag(qid) {
  if (!progress.flagged) progress.flagged = {};
  if (progress.flagged[qid]) delete progress.flagged[qid];
  else progress.flagged[qid] = Date.now();
  saveProgress();
  const btn = document.querySelector('.flag-btn');
  if (btn) {
    const flagged = !!progress.flagged[qid];
    btn.className = 'flag-btn' + (flagged ? ' flagged' : '');
    btn.innerHTML = flagged ? '\u{1F6A9}' : '\u{1F3F3}\uFE0F';
    btn.title = flagged ? 'Flagged for review' : 'Flag for review';
  }
}

  </div>`;

  const bottomNav = `<div class="bottom-nav">
    <button class="nav-item ${active==='dashboard'?'active':''}" onclick="state.screen='dashboard';render()">${svgHome} Home</button>
    <button class="nav-item" onclick="startQuiz('reviewDue',[])">${svgReview} Review${dueBadge}</button>
    <button class="nav-item" onclick="state.screen='chapterSelect';state.quizMode='study';render()">${svgStudy} Study</button>
    <button class="nav-item ${active==='stats'?'active':''}" onclick="state.screen='stats';render()">${svgStats} Stats</button>
    <button class="nav-item ${active==='settings'?'active':''}" onclick="state.screen='settings';render()">${svgSettings} Settings</button>
  </div>`;

  return sidebar + bottomNav;
}


function exportProgress() {
  const data = JSON.stringify(progress, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'endoboard_progress_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importProgress(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      progress = {...getDefaultProgress(), ...imported};
      saveProgress();
      render();
      alert('Progress imported successfully!');
    } catch(err) {
      alert('Invalid file format');
    }
  };
  reader.readAsText(file);
}
loadProgress();
updateStreak();
state.screen = 'dashboard';
render();

// --- iOS (Capacitor) daily local notification ----------------------------
// Only runs in the native iOS build. Scheduled from Capacitor.Plugins so the
// plugin import doesn't break the pure-web version.
async function scheduleDailyReviewReminder() {
  if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.LocalNotifications) return;
  const LN = window.Capacitor.Plugins.LocalNotifications;
  try {
    const perm = await LN.requestPermissions();
    if (perm.display !== 'granted') return;
    // Cancel any previous schedule so we don't stack.
    try { await LN.cancel({ notifications: [{ id: 1 }] }); } catch(e) {}
    const dueCount = getDueQuestions().length;
    await LN.schedule({
      notifications: [{
        id: 1,
        title: 'EndoBoard — time to review',
        body: dueCount > 0
          ? dueCount + ' cards due. Keep your streak alive.'
          : 'Open EndoBoard to keep your streak going.',
        schedule: { on: { hour: 8, minute: 0 }, every: 'day', allowWhileIdle: true },
        smallIcon: 'ic_stat_icon_config_sample',
      }],
    });
  } catch (e) { console.warn('notification schedule failed', e); }
}
if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
  scheduleDailyReviewReminder();
}
</script>
